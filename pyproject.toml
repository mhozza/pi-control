[project]
name = "pi-control"
version = "2.0.1"
description = "Simple Django app to control my Raspberry Pi and some home devices."
authors = [{ name = "Michal Hozza", email = "mhozza@gmail.com" }]
requires-python = ">=3.12,<4"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "amqp>=5.4.2",
    "asgiref>=3.13.0",
    "billiard>=4.3.2",
    "celery>=5.7.0,<6",
    "certifi>=2026.10.23",
    "chardet>=7.7.0",
    "defusedxml>=0.7.1",
    "Django>=6.0.10,<6.1",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-classy-tags>=4.1.0",
    "django-debug-toolbar>=6.3.0",
    "django-dotenv>=1.4.2",
    "django-sekizai>=4.1.0",
    "djangorestframework>=3.17.2",
    "idna>=3.20",
    "kombu>=5.7.0",
    "oauthlib>=4.0.1",
    "psutil>=7.2.2",
    "psycopg2-binary>=2.9.13",
    "PyJWT>=2.15.1",
    "python3-openid>=3.2.0",
    "pytz>=2026.6",
    "requests>=2.34.2",
    "requests-oauthlib>=2.0.0",
    "six>=1.17.0",
    "social-auth-app-django>=7.2.0",
    "social-auth-core>=6.2.0",
    "urllib3>=2.8.0",
    "vine>=5.1.0",
    "wakeonlan>=4.0.0",
    "whitenoise>=6.12.0",
    "channels>=4.3.2",
    "cachetools>=8.0.0",
    "gunicorn>=26.2.0",
]

[tool.black]
line-length = 100
target-version = ['py310']
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_mcu
  | node_modules
)/
'''

[dependency-groups]
dev = [
    "watchdog[watchmedo]>=7.1.0",
    "black>=26.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.17.0",
    "pytest-asyncio>=1.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pi_control.test_settings"
pythonpath = ["pi_control"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--tb=short -ra --import-mode=importlib --ignore=pi_control/pi_control/test_settings.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

